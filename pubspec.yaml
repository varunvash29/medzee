name: medzee
description: "Medzee — a beautiful, intelligent medicine companion."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Persistence
  drift: ^2.28.1
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.26
  path_provider: ^2.1.5
  path: ^1.9.1
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4

  # Notifications & timezone
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0
  flutter_timezone: ^4.1.0

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  collection: ^1.19.1
  url_launcher: ^6.3.2
  package_info_plus: ^8.3.0
  connectivity_plus: ^6.1.4
  crypto: ^3.0.6
  http: ^1.3.0

  # UI
  flutter_animate: ^4.5.2
  fl_chart: ^0.70.2

  # Device capabilities (optional / graceful fallback)
  image_picker: ^1.1.2
  mobile_scanner: ^7.0.1
  local_auth: ^2.3.0
  share_plus: ^11.0.0
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0
  firebase_auth: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  drift_dev: ^2.28.1
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
