org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# Gradle 8.10 does not run on the JDK 25 bundled with this machine's Android
# Studio (flutter build fails with a bare "25.0.3" error). Pin the Gradle
# daemon JVM to the installed JDK 17 instead. If you point Flutter at another
# JDK globally (`flutter config --jdk-dir=...`), this line can be removed.
org.gradle.java.home=C:/Program Files/Java/jdk-17

# AGP 8.9.1 supports compileSdk 36 but still prints a tested-up-to-35 nag.
android.suppressUnsupportedCompileSdk=36
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
